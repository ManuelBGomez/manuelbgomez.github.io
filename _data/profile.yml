# Short biography. Markdown is allowed (**bold**, *italic*, [links](https://...)).
# Leave a blank line between paragraphs.
bio: |
  I am a PhD student at [Universidade de Santiago de Compostela](https://www.usc.gal/en/) and a researcher at
  [Centro Singular de Investigación en Tecnoloxías Intelixentes (CiTIUS)](https://citius.gal/en/), supervised by
  [Prof. Manuel Mucientes](https://mucientes.pages.citius.gal/) and [Prof. Víctor M. Brea](https://citius.gal/en/team/victor-manuel-brea-sanchez/).

  My research focuses on **Computer Vision**, more specifically on **Multiple Object Tracking (MOT)**, which is the 
  core topic on my PhD. Before starting my PhD, I received an MSc in Computer Vision from Universidade de Santiago de Compostela.
  Moreover, I have received a highly competitive *Formación de Profesorado Universitario (FPU)* grant from the Spanish Ministry of Universities to support my PhD studies.

